<header class="topbar">

  <div class="topbar-left">
    <button class="icon-button menu-button" type="button" aria-label="Toggle navigation">
      <span class="material-symbols-rounded">menu</span>
    </button>

    <div class="page-context">
      <span class="page-title">Dashboard</span>
      <span class="breadcrumb">Business Overview</span>
    </div>
  </div>

  <div class="topbar-center">
    <div class="global-search">
      <span class="material-symbols-rounded">search</span>

      <input
        type="search"
        placeholder="Search products, invoices, customers..."
        aria-label="Global search"
      >

      <span class="search-shortcut">Ctrl K</span>
    </div>
  </div>

  <div class="topbar-actions">

    <button class="pos-button" type="button">
      <span class="material-symbols-rounded">point_of_sale</span>
      <span>New Sale</span>
    </button>

    <button class="icon-button" type="button" aria-label="Notifications">
      <span class="material-symbols-rounded">notifications</span>
      <span class="notification-dot"></span>
    </button>

    <div class="divider"></div>

    <button class="user-menu" type="button">
      <div class="user-avatar">SS</div>

      <div class="user-details">
        <strong>System Admin</strong>
        <span>Main Branch</span>
      </div>

      <span class="material-symbols-rounded dropdown-icon">
        keyboard_arrow_down
      </span>
    </button>

  </div>

</header>
